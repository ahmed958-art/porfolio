<header class="site-header">
  <a class="logo" routerLink="/">AHMED</a>

  <nav class="nav">
    <a routerLink="/" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="active">Home</a>
    <a routerLink="/services" routerLinkActive="active">Services</a>
    <a routerLink="/contact" routerLinkActive="active">Contact</a>
  </nav>

  <a class="hire-btn" routerLink="/contact">Hire Me</a>

  <button
    class="menu-toggle"
    type="button"
    [attr.aria-expanded]="mobileMenuOpen()"
    aria-label="Toggle navigation menu"
    (click)="toggleMobileMenu()"
  >
    <span [class.open]="mobileMenuOpen()"></span>
    <span [class.open]="mobileMenuOpen()"></span>
    <span [class.open]="mobileMenuOpen()"></span>
  </button>
</header>

@if (mobileMenuOpen()) {
  <div class="mobile-menu">
    <a
      routerLink="/"
      [routerLinkActiveOptions]="{ exact: true }"
      routerLinkActive="active"
      (click)="closeMobileMenu()"
    >
      Home
    </a>
    <a routerLink="/services" routerLinkActive="active" (click)="closeMobileMenu()">Services</a>
    <a routerLink="/contact" routerLinkActive="active" (click)="closeMobileMenu()">Contact</a>
    <a class="mobile-cta" routerLink="/contact" (click)="closeMobileMenu()">Hire Me</a>
  </div>
}
